<!DOCTYPE html>
<html>
<head>

<style>
body{

font-family: Georgia, serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    height:100vh;
    margin:0;
    padding-top:110px;
    background:#f6f3ee;
}
label{
display:block;
padding-top:10px;
}
#card{ 
padding:25px; 
border:1px solid #ddd;
 border-radius:20px;
  width:280px; 
  text-align:center; 
  background:#fffdfb;
   box-shadow:0px 4px 15px rgba(0,0,0,0.08); }

input{ 
width:100%; 
padding:10px;
 margin-top:10px; 
 box-sizing:border-box;
  }

button{ 
font-family:Georgia,serif;
width:100%; 
margin-top:15px; 
padding:10px; 
font-size:16px; 
background:#8b5e3c;
color:white;
 box-shadow:
0px -2px 10px rgba(0,0,0,0.08);
border-radius:40px;


}
#card{
    animation:fadeIn 0.4s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
<title>EchoNet - Verify</title>
<meta charset="UTF-8">

<script>
async function verifyOTP() {
  const otp = document.getElementById("otp").value.trim();

  if (otp.length !== 6) {
    document.getElementById("error").innerText = "Enter the full 6-digit code";
    return;
  }

  const res = await fetch("/verify-otp", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ otp: otp })  // ✅ no email needed, session handles it
  });

  const data = await res.json();

  if (data.status === "VERIFIED") {
    window.location.href = "/";
  } else if (data.status === "WRONG_OTP") {
    document.getElementById("error").innerText = "Wrong code, try again";
  } else if (data.status === "SESSION_EXPIRED") {
    document.getElementById("error").innerText = "Session expired, please sign up again";
  }
}
</script>

<!-- your existing styles here, no changes needed -->

</head>
<body>
<div id="card">
  <h1>Spill The Tea</h1>
  <hr>
  <label>Enter the OTP sent to your email</label>

  <div class="input-group">
    <input
      class="text-input"
      id="otp"
      type="text"
      maxlength="6"
      minlength="6"
      inputmode="numeric"
      placeholder="Enter the code"
    >
  </div>

  <!-- ✅ error div to show messages -->
  <div class="error-text" id="error"></div>

  <!-- ✅ fixed: onclick matches function name -->
  <button type="button" onclick="verifyOTP()">Verify</button>
</div>

<!-- your footer here, no changes needed -->
</body>
</html>
